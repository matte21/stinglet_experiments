apiVersion: v1
kind: Pod
metadata:
  name: btree
spec:
  containers:
    - name: btree
      image: localhost/mattedocker/btree:v0
      command: ["./bench_btree_mt"]
      resources:
        requests:
          cpu: "12"
          memory: "15668Mi"
        limits:
          cpu: "12"
          memory: "15668Mi"
  restartPolicy: Never
