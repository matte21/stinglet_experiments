apiVersion: v1
kind: Pod
metadata:
  name: silo-fm
  annotations:
    silo-fm/cpus-distribution-over-caches: "l1-spread"
    silo-fm/far-mem: "5Gi"
spec:
  containers:
    - name: silo-fm
      image: localhost/mattedocker/mol-silo:v0
      command: ["/dbtest"]
      args: ["--verbose", "--bench", "ycsb", "--scale-factor", "200000", "--num-threads", "8", "--ops-per-worker", "400000000"]
      resources:
        requests:
          cpu: "8"
          memory: "24Gi"
        limits:
          cpu: "8"
          memory: "24Gi"
  restartPolicy: Never
